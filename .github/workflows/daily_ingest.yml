name: daily-ingest-and-score

on:
  schedule:
    # Pre-market Mon-Fri (06:00-08:30 IST = 00:30-02:30 UTC)
    - cron: "30 0 * * 1-5"
    - cron: "30 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    # Market hours Mon-Fri every 30 min (08:30-15:30 IST = 03:00-10:00 UTC)
    - cron: "*/30 3-10 * * 1-5"
    # Post-market Mon-Fri every hour (15:30-21:30 IST = 10:00-16:00 UTC)
    - cron: "0 10,11,12,13,14,15,16 * * 1-5"
    # Night weekdays every 2 hours
    - cron: "0 17,19,21,23 * * 1-5"
    # Weekends every 2 hours
    - cron: "0 */2 * * 0,6"
  workflow_dispatch:

# allow this workflow to push updated CSVs back to the repo
permissions:
  contents: write

# prevent overlapping runs (useful when a run takes longer than the interval)
concurrency:
  group: daily-ingest-and-score
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # cache location for HF models
      HF_HOME: ~/.cache/huggingface
      TRANSFORMERS_CACHE: ~/.cache/huggingface

    steps:
      - name: Random jitter (120–300s)
        run: |
          python - << 'PY'
          import random, time
          t = random.randint(120, 300)
          print(f"Sleeping {t}s for polite staggering...")
          time.sleep(t)
          PY

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache FinBERT / HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch → Sentiment → Aggregate → Predict
        run: |
          python -m src.fetch_news
          python -m src.sentiment_vader
          python -m src.aggregate_sentiment
          # Fetch FII/DII only after 18:30 IST (13:00 UTC)
          python - << 'PY'
          from datetime import datetime, timezone, timedelta
          IST = timezone(timedelta(hours=5, minutes=30))
          ist_hour = datetime.now(IST).hour
          if ist_hour >= 18:
              print("Post-market: fetching FII/DII...")
              import os
              os.system("python -m src.fetch_fii_dii")
          else:
              print(f"Skipping FII/DII (IST hour: {ist_hour})")
          PY
          # keep next-day predictions fresh using the last trained model
          python -m src.predict_next || true
          python -m src.settle_signals || true

      - name: Commit refreshed CSVs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.csv data/history/*.csv || true
          git add data/fii_dii_history.csv || true
          git commit -m "daily auto-update (ingest/sentiment/aggregate/predict)" || echo "no changes"
          git push || true
