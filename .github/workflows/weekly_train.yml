name: weekly-train-and-predict

on:
  schedule:
    - cron: "0 14 * * 1"   # Monday 19:30 IST
    - cron: "0 14 * * 2"   # Tuesday 19:30 IST
    - cron: "0 14 * * 3"   # Wednesday 19:30 IST
    - cron: "0 14 * * 4"   # Thursday 19:30 IST
    - cron: "0 14 * * 5"   # Friday 19:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-train-and-predict
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ~/.cache/huggingface
      TRANSFORMERS_CACHE: ~/.cache/huggingface

    steps:
      - name: Random jitter (120–300s)
        run: |
          python - << 'PY'
          import random, time
          t = random.randint(120, 300)
          print(f"Sleeping {t}s for polite staggering...")
          time.sleep(t)
          PY

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache FinBERT / HF models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build dataset
        run: python -m src.build_dataset

      - name: Train regression
        run: python -m src.train_regression

      - name: Predict next day
        run: python -m src.predict_next

      - name: Commit models + artifacts
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.csv data/history/*.csv data/modeling/*.parquet data/modeling/*.csv models/*.pkl || true
          git commit -m "weekly retrain + predictions" || echo "no changes"
          git push || true
